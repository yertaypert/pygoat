services:
  migration:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_scoring &&
             python manage.py populate_labs &&
             python manage.py populate_challenges &&
             python manage.py startuplabs"
    environment:
      - PREBUILD_LABS_ON_STARTUP=true
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - my_network

  web:
    build: .
    command: gunicorn --bind 0.0.0.0:8000 --workers 6 --worker-class gthread --threads 4 --timeout 600 pygoat.wsgi
    environment:
      - LAB_DOMAIN=lvh.me
      - LAB_COOKIE_DOMAIN=.lvh.me
      - LAB_FORWARD_AUTH_URL=http://web:8000/auth/verify/
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "traefik.enable=true"
    depends_on:
      migration:
        condition: service_completed_successfully
    networks:
      - my_network

  traefik:
    image: traefik:latest
    container_name: traefik_proxy
    command:
      - "--configfile=/traefik.yml"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./traefik.yml:/traefik.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - my_network

  # Dev-only Vault for the centralized secret provisioning demo.
  # Start with: docker compose --profile vault up -d --wait vault
  # Never use dev mode or the root token outside local experimentation.
  vault:
    image: hashicorp/vault:2.2.2
    profiles: ["vault"]
    container_name: pygoat-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - my_network

networks:
  my_network:
    name: my_network
    driver: bridge