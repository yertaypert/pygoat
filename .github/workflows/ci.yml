name: ci
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.10
      - run: uv pip install -r requirements.txt
      - run: uv run python manage.py check
        env:
          DJANGO_SECRET_KEY: ci-dummy-key-not-a-real-secret
      - run: docker build -t pygoat:${{ github.sha }} .

  security:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v5
      - run: mkdir -p reports

      - name: SAST - Semgrep
        run: uvx semgrep scan --config p/python --config p/django --sarif --output reports/semgrep.sarif .
        continue-on-error: true

      - name: SAST - Bandit
        run: uvx bandit -r . -x ./tests,./.venv -f json -o reports/bandit.json
        continue-on-error: true

      - name: SCA - pip-audit
        run: uvx pip-audit -r requirements.txt --no-deps --disable-pip -f json -o reports/pip-audit.json
        continue-on-error: true

      - name: SCA - Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: json
          output: reports/trivy-sca.json
        continue-on-error: true

      - name: Secret scan - Gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks git . --config .gitleaks.toml --redact -v \
            --report-format json --report-path reports/gitleaks.json
        continue-on-error: true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
